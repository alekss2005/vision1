<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>KYIV OSINT RADAR v14.45.0</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
:root{
  --bg:#0a0f14;--panel:rgba(14,20,26,.94);--panel-solid:#0e141a;
  --text:#e8f0f5;--muted:#8fa5b2;--accent:#3b82f6;--danger:#dc2626;--ok:#35d07f;
  --border:rgba(120,140,160,.18);
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0a0f14;color:var(--text);-webkit-tap-highlight-color:transparent}
#app{position:absolute;inset:0;display:flex;flex-direction:column}

.header{height:52px;background:#0a0f14;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;padding-top:var(--safe-top);z-index:1000;flex:0 0 auto;font-size:13px}
.logo{font-weight:800;letter-spacing:.14em;font-size:14px;display:flex;align-items:center;gap:9px;white-space:nowrap;color:#fff;text-transform:uppercase}
.header-right{display:flex;align-items:center;gap:10px}
.status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.08em}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);transition:background .3s,box-shadow .3s}
.status-dot.err{background:#ef4444;box-shadow:0 0 8px #ef4444}
.status-dot.warn{background:#f59e0b;box-shadow:0 0 8px #f59e0b}

.region-plate{position:absolute;left:14px;top:calc(52px + var(--safe-top) + 10px);z-index:950;color:#cbd5e1;font-size:12px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;padding-bottom:8px;border-bottom:2px solid rgba(200,210,220,.35);pointer-events:none;user-select:none}

#map{flex:1;min-height:0;width:100%;background:#0a0f14}

.top-alert{position:absolute;top:calc(52px + var(--safe-top) + 10px);left:14px;right:14px;z-index:4600;border-radius:10px;overflow:hidden;display:none;box-shadow:0 8px 28px rgba(0,0,0,.6);backdrop-filter:blur(10px)}
.top-alert.show{display:block;animation:alertIn .3s ease-out}
@keyframes alertIn{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
.top-alert.ballistic{background:linear-gradient(90deg,#7f1d1d,#dc2626,#7f1d1d);color:#fff;animation:bbPulse .6s ease-in-out infinite;border:1px solid #fca5a5}
@keyframes bbPulse{0%,100%{background:linear-gradient(90deg,#7f1d1d,#dc2626,#7f1d1d)}50%{background:linear-gradient(90deg,#dc2626,#fca5a5,#dc2626)}}
.top-alert.impact{background:linear-gradient(90deg,#7c2d12,#ea580c,#7c2d12);color:#fff;border:1px solid #fdba74}
.top-alert.mass{background:linear-gradient(90deg,#4c1d95,#7c3aed,#4c1d95);color:#fff;border:1px solid #c4b5fd;animation:massPulse 1.2s ease-in-out infinite}
@keyframes massPulse{0%,100%{background:linear-gradient(90deg,#4c1d95,#7c3aed,#4c1d95)}50%{background:linear-gradient(90deg,#7c3aed,#a78bfa,#7c3aed)}}
.top-alert-inner{padding:9px 34px 9px 12px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:.86rem;line-height:1.25}
.top-alert-icon{font-size:1.4rem;flex-shrink:0;line-height:1}
.top-alert-body{flex:1;min-width:0}
.top-alert-title{font-weight:800;font-size:.86rem;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.top-alert-place{font-size:.78rem;font-weight:700;margin-top:2px;opacity:.95;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.top-alert-meta{font-size:.68rem;font-weight:700;opacity:.85;margin-top:2px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.top-alert-close{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.25);border:0;color:#fff;width:22px;height:22px;border-radius:50%;font-size:1rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0}

.mass-banner{position:absolute;top:calc(52px + var(--safe-top) + 10px);left:14px;right:14px;z-index:4620;border-radius:10px;overflow:hidden;display:none;box-shadow:0 8px 28px rgba(0,0,0,.6);background:linear-gradient(135deg,#4c1d95,#7c3aed,#4c1d95);border:1px solid #c4b5fd;color:#fff}
.mass-banner.show{display:block;animation:alertIn .3s ease-out}
.mass-banner-inner{padding:10px 34px 10px 12px;display:flex;align-items:flex-start;gap:10px;font-weight:700;font-size:.8rem;line-height:1.35}
.mass-banner-icon{font-size:1.5rem;flex-shrink:0;line-height:1}
.mass-banner-body{flex:1;min-width:0}
.mass-banner-title{font-weight:800;font-size:.86rem;letter-spacing:.02em}
.mass-banner-line{font-size:.74rem;font-weight:700;margin-top:3px;opacity:.95}
.mass-banner-line b{color:#fde047}
.mass-banner-close{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.3);border:0;color:#fff;width:22px;height:22px;border-radius:50%;font-size:1rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0}

.panel{position:absolute;left:10px;right:10px;bottom:calc(126px + var(--safe-bottom));background:var(--panel-solid);border:1px solid var(--border);border-left:4px solid #22c55e;border-radius:10px;overflow:hidden;z-index:900;display:flex;flex-direction:column;max-height:14vh;transition:max-height .2s ease;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.panel.collapsed{max-height:40px}
.panel-header{padding:8px 12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;height:40px;flex:0 0 40px}
.panel-title{font-size:12px;font-weight:800;letter-spacing:.10em;display:flex;align-items:center;gap:7px;text-transform:uppercase;color:#e8f0f5}
.panel-count{font-size:11px;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:5px;letter-spacing:.06em}
.panel-chev{font-size:.75rem;color:var(--muted);transition:transform .2s}
.panel.collapsed .panel-chev{transform:rotate(-90deg)}
.events{overflow-y:auto;flex:1;min-height:0}
.event{padding:7px 11px;border-bottom:1px solid #132028;cursor:pointer}
.event:last-child{border-bottom:0}
.event-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.event-type{font-weight:700;font-size:11px;display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-icon{font-size:12px;line-height:1;flex-shrink:0}
.event-time{font-size:10px;color:var(--muted);flex-shrink:0;font-weight:700}
.event-loc{margin-top:2px;font-size:10px;color:#b7c8d2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-meta{margin-top:3px;display:flex;gap:3px;flex-wrap:wrap}
.tag{padding:1px 5px;border-radius:4px;background:#132630;color:#8faab8;font-size:9px;font-weight:700;line-height:1.4}
.tag.mass{background:rgba(124,58,237,.4);color:#ddd6fe}
.panel-empty{padding:14px 11px;text-align:center;color:var(--muted);font-size:11px}

.hud-bottom{position:absolute;left:0;right:0;bottom:0;z-index:1000;padding:0 6px calc(var(--safe-bottom) + 4px);pointer-events:none;background:linear-gradient(180deg,rgba(10,15,20,0) 0%,rgba(10,15,20,.85) 30%,rgba(10,15,20,.95) 100%)}
.hud-bottom>*{pointer-events:auto}
.btn-row{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:4px 0 0}
button{background:var(--panel-solid);border:1px solid var(--border);color:var(--text);padding:4px 2px;border-radius:8px;font-size:8.5px;line-height:1.1;cursor:pointer;font-weight:700;min-width:0;height:auto;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:0 0 auto;touch-action:manipulation;letter-spacing:.01em;text-align:center;transition:background .15s,border-color .15s;overflow:hidden}
button span:first-child{font-size:20px!important;line-height:1}
button span:last-child{font-size:8.5px;line-height:1.05;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button:active{background:#1a2632}
button.danger{color:#fca5a5}
button.map-toggle.on{background:rgba(37,99,235,.85);color:#fff}
button.sound-btn.on{color:#4ade80}
button.sound-btn.muted{color:#f87171}
button.rings-btn.on{color:#60a5fa}
button.rings-btn.off{color:#64748b}
button.siren-btn{color:#f87171}
button.siren-btn.active{background:#dc2626!important;color:#fff!important;animation:sirenFlash .35s ease-in-out infinite}
button.strategic-btn.on{background:rgba(250,204,21,.85);color:#1f2937}
button.infra-btn.on{background:rgba(34,197,94,.85);color:#fff}
button.mass-btn.on{background:rgba(124,58,237,.9);color:#fff}
@keyframes sirenFlash{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.8)}50%{box-shadow:0 0 0 6px rgba(220,38,38,0)}}

.dev-signature{position:absolute;bottom:calc(var(--safe-bottom) + 0px);left:0;right:0;text-align:center;font-size:9px;color:#5a6a78;font-weight:500;letter-spacing:.04em;pointer-events:none;z-index:999;font-family:ui-monospace,monospace;padding:0 0 2px}

.leaflet-popup-content-wrapper{background:var(--panel-solid);color:#e8f0f5;border-radius:10px;border:1px solid rgba(148,163,184,.3);box-shadow:0 6px 24px rgba(0,0,0,.6)}
.leaflet-popup-tip{background:var(--panel-solid)}
.leaflet-popup-content{margin:9px 11px;font-size:.75rem;line-height:1.4;max-width:250px}
.leaflet-popup-close-button{color:#94a3b8!important;font-size:18px!important;padding:2px 6px!important}
.popup-title{font-weight:700;font-size:.82rem;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.popup-meta{color:#94a3b8;font-size:.68rem}
.type-uav{color:#f1f5f9}.type-missile,.type-ballistic{color:#f87171}
.type-fpv{color:#fbbf24}.type-recon{color:#7dd3fc}
.type-jet_drone{color:#f87171}.type-strategic{color:#facc15;font-weight:800}
.popup-channels{margin-top:6px;padding-top:5px;border-top:1px solid rgba(148,163,184,.18);font-size:.66rem}
.popup-channels .ch{display:inline-block;background:rgba(148,163,184,.2);color:#cbd5e1;padding:1px 6px;border-radius:8px;margin:2px 2px 2px 0;border:1px solid rgba(148,163,184,.3)}
.popup-channels .ch.prio{background:rgba(251,191,36,.25);border-color:rgba(251,191,36,.5);color:#fbbf24}
.popup-remove-btn{margin-top:8px;width:100%;height:30px;font-size:.75rem;background:rgba(220,38,38,.25);border:1px solid rgba(248,113,113,.5);color:#fca5a5;border-radius:6px;cursor:pointer;font-weight:800}

.threat-wrap{position:relative;width:28px;height:28px}
.threat-rotate{position:absolute;inset:0;transform-origin:center center;will-change:transform}
.threat-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 5px rgba(0,0,0,.5));transform-origin:center center;position:relative;animation:pulse 1.8s ease-in-out infinite;transition:filter .3s ease}
.threat-icon svg{width:24px;height:24px;display:block}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 3px rgba(0,0,0,.5));opacity:1}50%{filter:drop-shadow(0 0 8px rgba(59,130,246,.55));opacity:.92}}
.threat-icon.confirm-2{filter:drop-shadow(0 0 7px rgba(34,197,94,.9))}
.threat-icon.confirm-3{filter:drop-shadow(0 0 10px rgba(250,204,21,.95));animation:cPulse 1.3s ease-in-out infinite}
.threat-icon.confirm-5{filter:drop-shadow(0 0 14px rgba(250,204,21,1));animation:cPulse 1s ease-in-out infinite}
@keyframes cPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.threat-icon.falling{animation:fallingBlink .55s ease-in-out infinite}
@keyframes fallingBlink{0%,100%{filter:drop-shadow(0 0 2px rgba(220,38,38,.9));opacity:1}50%{filter:drop-shadow(0 0 12px rgba(220,38,38,1));opacity:.35}}
.threat-icon.stale{opacity:.55;filter:grayscale(.4)}
.threat-icon.threat-pulse{animation:threatPulse 1s ease-in-out infinite}
@keyframes threatPulse{0%,100%{filter:drop-shadow(0 0 3px rgba(220,38,38,.9));opacity:1}50%{filter:drop-shadow(0 0 12px rgba(220,38,38,1));opacity:.55}}
.threat-icon.priority-star::after{content:"⭐";position:absolute;top:-10px;left:-6px;font-size:11px;filter:drop-shadow(0 0 3px rgba(251,191,36,1))}
.count-badge{position:absolute;right:-6px;top:-6px;height:14px;min-width:14px;padding:0 4px;border-radius:7px;background:#ea580c;color:#fff;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;border:1px solid #fff;z-index:5}
.confirm-badge{position:absolute;left:-6px;top:-6px;height:13px;min-width:13px;padding:0 3px;border-radius:7px;background:#16a34a;color:#fff;font-size:8px;font-weight:900;display:flex;align-items:center;justify-content:center;border:1px solid #fff;z-index:5}
.confirm-badge::before{content:"✓"}
.confirm-badge.pending{background:#0ea5e9}

.impact-marker-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;filter:drop-shadow(0 0 5px rgba(255,120,0,.95)) drop-shadow(0 0 2px rgba(220,38,38,1));animation:impactPop .9s ease-in-out infinite}
@keyframes impactPop{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(6deg);opacity:.85}}
.impact-marker{width:36px;height:36px;display:flex;align-items:center;justify-content:center;line-height:1;cursor:pointer}
.impact-marker svg{width:32px;height:32px;display:block}
.impact-marker.hit{animation:impactHit 1s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(220,38,38,1))}
@keyframes impactHit{0%,100%{transform:scale(1)}50%{transform:scale(1.25);opacity:.85}}
.arrival-unknown{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fbbf24;text-shadow:0 0 6px rgba(251,191,36,.9)}
.impact-marker.unknown{animation:impactUnknown 1.4s ease-in-out infinite}
@keyframes impactUnknown{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.7}}

.err-banner{position:absolute;top:calc(52px + var(--safe-top));left:0;right:0;z-index:5000;background:#b91c1c;color:#fff;padding:8px 10px;font-size:.72rem;display:none}
.err-banner.show{display:block}
.err-banner b{font-weight:800}
.err-banner .err-close{float:right;background:0;border:0;color:#fff;font-size:1.1rem;cursor:pointer;padding:0 4px;line-height:1}
.toast{position:absolute;left:50%;top:calc(52px + var(--safe-top) + 60px);transform:translateX(-50%);z-index:2000;background:#0e141a;color:#f1f5f9;padding:8px 14px;border-radius:8px;border:1px solid rgba(148,163,184,.4);font-size:.74rem;box-shadow:0 6px 20px rgba(0,0,0,.5);opacity:0;transition:opacity .25s;pointer-events:none;max-width:85vw;text-align:center}
.toast.show{opacity:1}

.leaflet-control-attribution{font-size:8px!important;background:rgba(10,15,20,.8)!important;color:#64748b!important;padding:2px 5px!important}
.leaflet-control-zoom a{background:rgba(14,20,26,.9)!important;color:#e8f0f5!important;border-color:#1f3540!important;width:28px!important;height:28px!important;line-height:28px!important;font-size:15px!important}
.leaflet-control-zoom{top:calc(52px + var(--safe-top) + 10px)!important;right:10px!important}

.settlement-marker{background:transparent;border:0}
.settlement-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;border:1.5px solid #fff}
.settlement-dot.city{background:#16a34a;width:11px;height:11px;border-width:2px}
.settlement-dot.raion{background:#3b82f6;width:9px;height:9px}
.infra-marker{background:transparent;border:0}
.infra-bridge{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;filter:drop-shadow(0 0 4px rgba(96,165,250,.9))}
.infra-energy{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;filter:drop-shadow(0 0 4px rgba(250,204,21,.9))}

@media (min-width: 700px){
  .panel{width:380px;left:14px;right:auto;bottom:calc(126px + var(--safe-bottom))}
  .top-alert{left:14px;right:auto;width:420px}
  .mass-banner{left:14px;right:auto;width:420px}
  .btn-row{max-width:600px;margin:0 auto}
}
@media (max-width: 380px){
  button{font-size:7.5px;min-height:48px;padding:3px 1px}
  button span:first-child{font-size:18px!important}
  button span:last-child{font-size:7.5px}
}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo">
      <svg width="22" height="26" viewBox="0 0 22 26" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
        <path d="M11 1 L21 4 L21 13 C21 19 16.5 23.5 11 25 C5.5 23.5 1 19 1 13 L1 4 Z" fill="#e8f0f5" stroke="#8fa5b2" stroke-width="1"/>
        <path d="M11 4 L11 22 M6 9 L16 9 M11 6 L11 12" stroke="#0a0f14" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>KYIV OSINT RADAR</span>
    </div>
    <div class="header-right">
      <div class="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">ЗАГРУЗКА…</span>
      </div>
    </div>
  </div>

  <div id="map"></div>
  <div class="region-plate" id="regionPlate">УКРАЇНА</div>

  <div class="top-alert" id="topAlert">
    <button class="top-alert-close" id="topAlertClose" aria-label="Закрити">×</button>
    <div class="top-alert-inner">
      <div class="top-alert-icon" id="topAlertIcon">🚨</div>
      <div class="top-alert-body">
        <div class="top-alert-title" id="topAlertTitle">—</div>
        <div class="top-alert-place" id="topAlertPlace" style="display:none">—</div>
        <div class="top-alert-meta" id="topAlertMeta" style="display:none">—</div>
      </div>
    </div>
  </div>

  <div class="mass-banner" id="massBanner">
    <button class="mass-banner-close" id="massBannerClose" aria-label="Закрити">×</button>
    <div class="mass-banner-inner">
      <div class="mass-banner-icon" id="massBannerIcon">🚀</div>
      <div class="mass-banner-body">
        <div class="mass-banner-title" id="massBannerTitle">МАСОВАНА ЗАГРОЗА</div>
        <div class="mass-banner-line" id="massBannerLine1">—</div>
        <div class="mass-banner-line" id="massBannerLine2" style="display:none">—</div>
        <div class="mass-banner-line" id="massBannerLine3" style="display:none">—</div>
      </div>
    </div>
  </div>

  <div class="err-banner" id="errBanner">
    <button class="err-close" onclick="this.parentNode.classList.remove('show')">×</button>
    <b>Помилка:</b> <span id="errText">—</span>
  </div>

  <div class="panel collapsed" id="panel">
    <div class="panel-header" id="panelHeader">
      <div class="panel-title">▶ ЛЕНТА ПОДІЙ</div>
      <div class="panel-count">
        <span id="eventCount">0 подій</span>
        <span class="panel-chev">▼</span>
      </div>
    </div>
    <div class="events" id="events"></div>
  </div>

  <div class="hud-bottom">
    <div class="btn-row">
      <button type="button" id="btnRefresh" title="Оновити"><span>⟳</span><span>Оновити</span></button>
      <button type="button" id="btnClear" class="danger" title="Очистити"><span>✕</span><span>Очистити</span></button>
      <button type="button" id="btnColorToggle" title="Палітра">
        <span style="position:relative;display:inline-block">🎨<i id="uavColorDot" style="position:absolute;right:-4px;bottom:-2px;width:10px;height:10px;border-radius:50%;border:2px solid #0e141a;background:#ffffff;display:block"></i></span>
        <span>Палітра</span>
      </button>
      <button type="button" class="rings-btn on" id="btnRingsToggle" title="Кільця"><span>🎯</span><span>Кільця</span></button>
      <button type="button" class="settlements-btn" id="btnSettlements" title="Населені пункти"><span>🏘</span><span>Населені пункти</span></button>
      <button type="button" class="infra-btn" id="btnInfra" title="Інфраструктура"><span>🏗</span><span>Інфраструктура</span></button>

function haversineKm(a,b,c,d){const R=6371,toR=x=>x*Math.PI/180;const dLat=toR(c-a),dLon=toR(d-b);const x=Math.sin(dLat/2)**2+Math.cos(toR(a))*Math.cos(toR(c))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function bearingBetween(lat1,lon1,lat2,lon2){const φ1=lat1*Math.PI/180,φ2=lat2*Math.PI/180,Δλ=(lon2-lon1)*Math.PI/180;const y=Math.sin(Δλ)*Math.cos(φ2);const x=Math.cos(φ1)*Math.sin(φ2)-Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);return(Math.atan2(y,x)*180/Math.PI+360)%360;}
function showToast(msg,ms=1800){const t=$("toast");if(!t)return;t.textContent=msg;t.classList.add("show");clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove("show"),ms);}

}

/* AUDIO */
function initAudio(){if(audioCtx)return audioCtx;try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return null;audioCtx=new Ctx();}catch(e){audioCtx=null;}return audioCtx;}
function unlockAudio(){const c=initAudio();if(c&&c.state==="suspended")c.resume().catch(()=>{});}
function playBell(){if(!audioCtx)return;const now=audioCtx.currentTime;[{f:880,g:.30,d:1.1},{f:1760,g:.14,d:.7}].forEach(p=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.setValueAtTime(p.f,now);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(p.g,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+p.d);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+p.d+.05);});}

function playSirenOnce(dur=3000){const c=initAudio();if(!c)return;if(c.state==="suspended")c.resume();const n=c.currentTime,d=dur/1000;const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type="sawtooth";o.frequency.setValueAtTime(440,n);o.frequency.linearRampToValueAtTime(880,n+d*.25);o.frequency.linearRampToValueAtTime(660,n+d*.6);o.frequency.linearRampToValueAtTime(440,n+d);f.type="bandpass";f.frequency.value=800;f.Q.value=3;g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(.35,n+.1);g.gain.setValueAtTime(.35,n+d-.15);g.gain.linearRampToValueAtTime(.0001,n+d);o.connect(f);f.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d+.05);}

const wsState={threats:new Map()};

function normalizeThreat(t){const o={...t};const txt=[t.type,t.title,t.explanationShort].filter(Boolean).join(" ");const cls=CLASSIFIER(txt);if(cls?.isZircon){o.type="zircon";}else if(cls?.isJetDrone){o.type="jet_drone";}else if(cls?.isGeran5){o.type="geran5";}else if(cls?.isGeran){o.type=cls.type;}else if(cls&&!TYPE_META[t.type])o.type=cls.type;o._exactName=detectExactName(txt)||null;return o;}
function resolveHeading(t){if(t.heading!=null)return t.heading;if(t.velocity?.bearingDeg!=null)return t.velocity.bearingDeg;return null;}
function upsertThreat(raw){if(!threatLayer)return;try{const tx=normalizeThreat(raw);if(tx.lat==null||tx.lon==null)return;if(!inZone(tx.lat,tx.lon)){removeTrackInternal(tx.id);return;}let heading=resolveHeading(tx);if(heading==null)heading=bearingBetween(tx.lat,tx.lon,CONFIG.KYIV[0],CONFIG.KYIV[1]);const existing=tracks.get(tx.id);if(existing){existing.marker.setLatLng([tx.lat,tx.lon]);existing.threat=tx;}else{const marker=L.marker([tx.lat,tx.lon],{icon:makeIcon(tx,heading,0,0,false,false,null,null,false,false,false),zIndexOffset:800});marker.bindPopup(`<div class="popup-title type-${tx.type}">${esc(tx._exactName||typeLabel(tx))}</div><div class="popup-meta">${esc(tx.locality||tx.region||"—")}</div>`,CONFIG.POPUP_OPTS);marker.addTo(threatLayer);tracks.set(tx.id,{id:tx.id,marker,threat:tx,heading});scheduleFeedUpdate();}}catch(e){console.warn("upsertThreat",e);}}
function syncThreats(list){const seen=new Set();for(const tx of list||[]){seen.add(tx.id);upsertThreat(tx);}for(const id of[...tracks.keys()])if(!seen.has(id))removeTrackInternal(id);}
function removeTrackInternal(id){const tr=tracks.get(id);if(!tr)return;try{if(threatLayer)threatLayer.removeLayer(tr.marker);}catch(e){}tracks.delete(id);}
function animate(){if(!animRunning||!map)return;rafId=requestAnimationFrame(animate);}
function startAnim(){if(animRunning)return;animRunning=true;rafId=requestAnimationFrame(animate);}
function stopAnim(){animRunning=false;if(rafId){cancelAnimationFrame(rafId);rafId=null;}}

function syncMessageThreats(messages){const now=Date.now();for(const m of (messages||[])){const text=m.text||"";const ch=(m.channel||"unknown").replace(/^@/,"").toLowerCase();const msgMs=m.date?Date.parse(m.date):now;if(!text||text.length<8)continue;processMassActivity(text,ch,msgMs);}}
function detectExactName(text){if(!text)return null;const t=text.toLowerCase();let m=t.match(/герань\s*-?\s*([2-5])\b/);if(m)return`Герань-${m[1]}`;if(/реактивн/.test(t)&&/(шахед|геран|бпла)/.test(t))return"Реактивний БПЛА";if(/циркон|zircon/.test(t))return"Циркон";if(/калибр|калібр/.test(t))return"Калібр";if(/кинжал|кінжал/.test(t))return"Кинжал";if(/іскандер|искандер/.test(t))return"Іскандер";if(/fpv|фпв/.test(t))return"FPV";return null;}
const CLASSIFIER=(()=>{const HARD=[{re:/циркон|zircon/i,type:"zircon",isZircon:true},{re:/реактивн[а-яіїєґ]*\s*(шахед|геран|бпла|дрон)/i,type:"jet_drone",isJetDrone:true},{re:/герань\s*-?\s*5/i,type:"geran5",isGeran5:true,isGeran:true},{re:/герань\s*-?\s*4/i,type:"geran4",isGeran:true},{re:/герань\s*-?\s*3/i,type:"geran3",isGeran:true},{re:/герань\s*-?\s*2/i,type:"geran2",isGeran:true},{re:/балістик|баллистик|кинжал|іскандер|искандер|кн-?23/i,type:"ballistic"},{re:/калібр|калибр|х-?\s*101|х-?\s*555|крилат[аиі]?\s+ракет/i,type:"missile"}];const SOFT=[{re:/fpv|фпв/i,type:"fpv"},{re:/розвідник|разведчик|recon/i,type:"recon"},{re:/шахед|герань|бпла|дрон|безпілотник|реактив[а-яіїєґ]*/i,type:"uav"}];return function(t){t=t||"";for(const r of HARD)if(r.re.test(t))return{...r,hard:true};for(const r of SOFT)if(r.re.test(t))return{...r,hard:false};return null;};})();

/* ============================================================
   INIT
============================================================ */
$("btnRefresh").addEventListener("click",()=>{unlockAudio();if(wsConnected&&ws){try{ws.close();}catch(e){}wsConnect();}else startRestPolling();showToast("Оновлення…");});
$("btnClear").addEventListener("click",()=>{unlockAudio();tracks.forEach(tr=>{try{threatLayer.removeLayer(tr.marker);}catch(e){}});tracks.clear();msgMarkers.clear();impactMarkers.clear();activeWarnings.clear();strategicActivity.clear();hideMassBanner();renderFeed();showToast("Очищено");});
$("massBannerClose").addEventListener("click",()=>hideMassBanner());
$("panelHeader").addEventListener("click",()=>{const p=$("panel");if(p)p.classList.toggle("collapsed");});
(function(){const b=$("soundToggle");if(!b)return;function update(){b.textContent=CONFIG.SOUND_ENABLED?"🔔":"🔕";b.className="sound-btn "+(CONFIG.SOUND_ENABLED?"on":"muted");}update();let last=0;b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();unlockAudio();const n=Date.now();playAlertSound(true);if(n-last<500){CONFIG.SOUND_ENABLED=!CONFIG.SOUND_ENABLED;update();showToast(CONFIG.SOUND_ENABLED?"🔔 увімк":"🔕 вимк");last=0;}else{last=n;showToast("🔔 тест");}});})();
(function(){const b=$("sirenBtn");if(!b)return;let last=0;b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();unlockAudio();const n=Date.now();if(n-last<500){triggerSirenSequence(3000,3);showToast("🚨 3× сирена");last=0;}else{playSirenOnce(3000);flashSirenBtn(3000);showToast("🚨 1×");last=n;}});})();
(function(){const b=$("btnColorToggle");if(!b)return;const dot=$("uavColorDot");function update(){const c=UAV_COLORS[uavColorIdx];if(dot)dot.style.background=c.hex;}update();b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();uavColorIdx=(uavColorIdx+1)%UAV_COLORS.length;saveUavColor();update();showToast("🎨 БПЛА: "+UAV_COLORS[uavColorIdx].name);unlockAudio();});})();
(function(){const b=$("btnRingsToggle");if(!b||!map)return;function apply(){if(ringsVisible){if(!map.hasLayer(ringsLayer))ringsLayer.addTo(map);b.classList.add("on");b.classList.remove("off");}else{if(map.hasLayer(ringsLayer))map.removeLayer(ringsLayer);b.classList.add("off");b.classList.remove("on");}}apply();b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();ringsVisible=!ringsVisible;try{localStorage.setItem(RINGS_KEY,ringsVisible?"1":"0");}catch(e2){}apply();showToast(ringsVisible?"🎯 Рамка УВІМК":"🎯 Рамка ВИКЛ");unlockAudio();});})();
(function(){const b=$("btnMapToggle");if(!b||!map)return;b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();unlockAudio();if(currentBase==="osm"){if(osmLayer)map.removeLayer(osmLayer);baseSat.addTo(map);currentBase="sat";b.classList.add("on");showToast("🛰 Супутник");}else{map.removeLayer(baseSat);osmLayer=L.tileLayer(CONFIG.TILE_URL,{maxZoom:16,attribution:CONFIG.TILE_ATTR});osmLayer.addTo(map);L.tileLayer(CONFIG.TILE_URL_REF,{maxZoom:16,opacity:.85}).addTo(map);currentBase="osm";b.classList.remove("on");showToast("🗺 Схема");}});})();
(function(){const b=$("btnZoomUkraine");if(!b||!map)return;b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();unlockAudio();map.fitBounds(CONFIG.UKRAINE_FIT_BOUNDS,{padding:[10,10]});showToast("🇺🇦 Вся Україна");});})();
(function(){const b=$("btnSettlements");if(!b)return;if(settlementsVisible)b.classList.add("on");b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();unlockAudio();toggleSettlementsLayer();});})();
(function(){const b=$("btnStrategic");if(!b)return;if(strategicVisible)b.classList.add("on");b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();unlockAudio();toggleStrategicLayer();});})();
(function(){const b=$("btnInfra");if(!b)return;b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();unlockAudio();cycleInfraMode();});})();
(function(){const b=$("btnMass");if(!b)return;b.classList.toggle("on",massBannerActive);b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();unlockAudio();if(massBannerActive)hideMassBanner();else showToast("📡 Очікування масових пусків…");});})();
document.addEventListener("visibilitychange",()=>{if(document.hidden){stopRestPolling();stopAnim();}else{if(!wsConnected)startRestPolling();startAnim();unlockAudio();}});

(async function init(){
  try{
    setStatus("warn","ЗАГРУЗКА…");
    wsConnect();
    fetchMessages();
    setInterval(fetchMessages,5000);
    startAnim();
    renderFeed();
    setInterval(renderFeed,8000);
    setTimeout(()=>unlockAudio(),500);
    updateSettlementsVisibility();
    if(strategicVisible&&strategicLayer&&map&&!map.hasLayer(strategicLayer))strategicLayer.addTo(map);
    const b=$("btnInfra");
    if(b){
      b.classList.remove("on");
      if(infraMode>=1)b.classList.add("on");
    }
    if(infraMode>0)rebuildInfraLayer();
  }catch(e){showErr("init: "+(e&&e.message||e));}
})();
</script>
